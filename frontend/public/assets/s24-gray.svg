<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyS24Gray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C9996"/>
      <stop offset="50%" stop-color="#7B7875"/>
      <stop offset="100%" stop-color="#5E5C59"/>
    </linearGradient>
    <radialGradient id="lensS24" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="shadowS" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="460" rx="140" ry="18" fill="#000000" opacity="0.2" filter="blur(8px)"/>
  <!-- Sharp, boxy Ultra body with slight corner radius -->
  <rect x="90" y="30" width="220" height="420" rx="14" fill="url(#bodyS24Gray)" filter="url(#shadowS)" stroke="#B5B2AF" stroke-width="2"/>
  <rect x="94" y="34" width="212" height="412" rx="11" fill="url(#bodyS24Gray)" opacity="0.95"/>
  <!-- Individual floating camera rings (Samsung S24 Ultra style) -->
  <!-- Main 200MP Lens (Top Left) -->
  <circle cx="132" cy="74" r="18" fill="url(#lensS24)" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="132" cy="74" r="11" fill="#020617" stroke="#334155" stroke-width="2"/>
  <circle cx="130" cy="72" r="4" fill="#38BDF8" opacity="0.6"/>
  <!-- Ultra-wide Lens (Middle Left) -->
  <circle cx="132" cy="120" r="18" fill="url(#lensS24)" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="132" cy="120" r="11" fill="#020617" stroke="#334155" stroke-width="2"/>
  <circle cx="130" cy="118" r="4" fill="#38BDF8" opacity="0.6"/>
  <!-- Periscope 50MP Lens (Bottom Left) -->
  <circle cx="132" cy="166" r="18" fill="url(#lensS24)" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="132" cy="166" r="11" fill="#020617" stroke="#334155" stroke-width="2"/>
  <circle cx="130" cy="164" r="4" fill="#38BDF8" opacity="0.6"/>
  <!-- Telephoto 10MP (Top Right) -->
  <circle cx="174" cy="74" r="12" fill="url(#lensS24)" stroke="#CBD5E1" stroke-width="2.5"/>
  <circle cx="174" cy="74" r="7" fill="#020617"/>
  <!-- Laser AF & Flash (Middle Right) -->
  <circle cx="174" cy="110" r="6" fill="#FEF08A" stroke="#EAB308" stroke-width="1"/>
  <circle cx="174" cy="138" r="10" fill="url(#lensS24)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Samsung Logo -->
  <text x="200" y="380" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#D1D5DB" letter-spacing="4">SAMSUNG</text>
</svg>
